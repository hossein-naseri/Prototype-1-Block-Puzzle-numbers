<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Operator Blocks</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
<header id="topbar">
  <select id="variant-select" aria-label="Variant"></select>
  <div id="seed-row">
    <input id="seed-input" aria-label="Seed" inputmode="numeric" />
    <button id="seed-copy" type="button">Copy</button>
  </div>
  <button id="restart-btn" type="button">Restart</button>
</header>

<details id="settings-panel">
  <summary>Settings</summary>
  <div class="settings-body">
    <div class="settings-grid">
      <label class="setting">
        <span>Board size</span>
        <input id="set-board-size" type="number" min="2" max="9" step="1" />
      </label>
      <label class="setting">
        <span>Bar capacity <small>(win at full)</small></span>
        <input id="set-bar-capacity" type="number" min="1" step="1" />
      </label>
      <label class="setting">
        <span>Max tile value <small>(strike above)</small></span>
        <input id="set-max-value" type="number" min="1" step="1" />
      </label>
      <label class="setting">
        <span>Strikes to lose</span>
        <input id="set-max-strikes" type="number" min="1" step="1" />
      </label>
    </div>

    <label class="setting">
      <span>Starting tile value</span>
      <span class="setting-inline">
        <input id="set-start-value" type="number" min="0" step="1" />
        <label class="checkbox"><input id="set-start-random" type="checkbox" /> Random</label>
      </span>
    </label>

    <fieldset class="setting weights">
      <legend>Block size spawn rate <small>(relative; normalized)</small></legend>
      <div id="block-size-rows"></div>
    </fieldset>

    <fieldset class="setting weights">
      <legend>Operator weights <small>(relative; normalized)</small></legend>
      <div id="weight-rows"></div>
    </fieldset>

    <div class="settings-actions">
      <button id="settings-reset" type="button">Reset to defaults</button>
    </div>
  </div>
</details>

<div id="hud"></div>

<main id="play-area">
  <div id="bars-wrap">
    <div id="score-bars"></div>
  </div>

  <div id="board"></div>

  <div id="game-over" hidden></div>

  <div id="next-hand-wrap">
    <div class="label">Next</div>
    <div id="next-hand"></div>
  </div>

  <div id="hand-wrap">
    <div class="label">Hand</div>
    <div id="hand"></div>
  </div>
</main>

<footer id="statbar">
  <div>Score: <span id="score">0</span></div>
  <div id="strikes-readout">Strikes: <span id="strikes">0</span></div>
  <div>Turns: <span id="turns">0</span></div>
  <button id="export-log" type="button">Export log</button>
</footer>

<script type="module" src="ui/main.js"></script>
</body>
</html>
